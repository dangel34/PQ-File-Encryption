[package]
name = "pqfile"
version = "3.0.1"
edition = "2021"
description = "Quantum-resistant file encryption using ML-KEM-768 and ChaCha20-Poly1305"
license = "MIT"
autobins = false

[[bin]]
name = "pqfile"
path = "src/main.rs"

[dependencies]
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
chacha20poly1305 = "0.10"
getrandom = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
pem = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
sha3 = "0.12"
argon2 = { version = "0.5", features = ["zeroize"] }
aes-gcm = "0.10"
rpassword = "7"
ml-dsa = { version = "0.1.0", features = ["getrandom", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "crypto"
harness = false

[package.metadata.deb]
maintainer = "Derek <cheery.09.purine@icloud.com>"
copyright = "2025"
license-file = ["LICENSE", "0"]
extended-description = "Quantum-resistant file encryption using ML-KEM-768 and ChaCha20-Poly1305"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/pqfile", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/pqfile", dest = "/usr/bin/pqfile", mode = "755" },
]
