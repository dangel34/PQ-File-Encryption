[package]
name = "pqfile"
version = "4.3.3"
edition = "2021"
description = "Quantum-resistant file encryption: ML-KEM (512/768/1024), hybrid X25519+ML-KEM-768, ML-DSA-65 and SLH-DSA signing, multi-recipient, Shamir sharing"
license = "MIT"
repository = "https://github.com/dangel34/PQ-File-Encryption"
homepage = "https://github.com/dangel34/PQ-File-Encryption"
documentation = "https://docs.rs/pqfile"
readme = "../README.md"
keywords = ["encryption", "post-quantum", "ml-kem", "chacha20", "cryptography"]
categories = ["cryptography", "filesystem"]

[lints.rust]
# `--cfg fuzzing` is injected by cargo-fuzz; stego.rs gates its
# Argon2-skipping fuzz entry points on it so they never ship in the API.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
chacha20poly1305 = "0.11"
getrandom = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
pem = "4"
thiserror = "2"
sha3 = "0.12"
argon2 = { version = "0.5", features = ["zeroize"] }
aes-gcm = "0.11"
# >=0.1.1 required: 0.1.0-rc.3 and earlier carry a Decompose timing side-channel
# (RUSTSEC-2025-0144) and a signature-malleability regression (GHSA-5x2r-hc65-25f9),
# both fixed by 0.1.0-rc.4. Do not loosen this floor.
ml-dsa = { version = "0.1.1", features = ["getrandom", "zeroize"] }
# RustCrypto has not cut a stable 0.2.0 as of 2026-07-14; re-check on each dependency
# bump whether a stable release exists yet, since this is the only SLH-DSA backend.
slh-dsa = { version = "0.2.0-rc.5", features = ["zeroize"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
rayon = "1"
bech32 = "0.12"
# Constant-time MAC comparison in sealed_sender.rs.
subtle = "2"
# Cover-image decode/encode for stego.rs (`stego` feature). PNG (lossless,
# required for LSB embedding to survive) plus JPEG so a JPEG cover photo can
# be used as input; output is always re-encoded as PNG regardless of input
# format, per the standing BLAKE3-for-non-format-hashing guideline this also
# uses blake3 rather than SHA3 since the payload checksum never touches the
# wire format.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# Also used by resume.rs's checkpoint prefix-hash convention (never touches
# the wire format), so unlike `image` this is not gated behind `stego`.
blake3 = "1"
# Classical Reed-Solomon BCH error correction for fec.rs (`fec` feature).
# Pure Rust, no_std-compatible, no system dependencies - gated behind an
# opt-in feature anyway since bit-rot protection is a niche need most builds
# don't want the extra dependency for. See docs/ROADMAP.md,
# "Forward-error-correction for cold-storage resilience".
reed-solomon = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.4 needs the wasm_js feature to use globalThis.crypto in a browser/Node.js context.
getrandom = { workspace = true, features = ["wasm_js"] }
# getrandom 0.3 needs both the wasm_js feature AND the getrandom_backend cfg flag
# (set in .cargo/config.toml) to select the wasm_js backend.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# chacha20poly1305 -> rand_core -> getrandom 0.2; needs the js feature for WASM.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.13.3", features = ["zstdmt"] }
# Core types for hardware-backed key credential storage.
keyring-core = "1"
# Memory-mapped I/O for zero-copy file encryption.
memmap2 = "0.9"
# mlock/VirtualLock for in-flight secrets (secret.rs); no allocator features.
memsec = { version = "0.7", default-features = false, features = ["use_os"] }
# Optional F*-verified ML-KEM backend (`kem-libcrux` feature). Also listed
# unconditionally below as a dev-dependency so tests/kem_oracle.rs runs on
# every `cargo test` regardless of feature flags; Cargo unions the two.
libcrux-ml-kem = { version = "0.0.10", optional = true }
# Time-lock encryption (`tlock` feature): IBE over the drand beacon (tlock) and
# a synchronous (ureq-based, no tokio) drand HTTP client (drand_core). This is
# the only network-capable dependency in the workspace; both are optional so a
# default build never pulls in an HTTP stack, and native-only since ureq does
# not target wasm32. See pqfile/src/tlock.rs.
tlock = { version = "0.0.10", optional = true }
drand_core = { version = "0.0.19", optional = true }

# Platform-specific credential store backends (no sqlite/tantivy bloat).
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[features]
# Enable async encrypt/decrypt API backed by Tokio.
async = ["tokio"]
# Enable statistical constant-time tests (requires a quiet machine; not for CI).
timing-tests = []
# Opt into Cryspen's F*-verified libcrux-ml-kem as the ML-KEM backend instead
# of the default RustCrypto ml-kem. No wire-format change: pqfile/tests/kem_oracle.rs
# proves the two agree byte-for-byte on FIPS 203. See docs/ROADMAP.md, "Optional
# formally verified ML-KEM backend".
kem-libcrux = ["dep:libcrux-ml-kem"]
# Time-locked encryption (V11 format): encrypt --tlock-round is fully offline;
# decrypt fetches a drand beacon signature over the network. See docs/ROADMAP.md,
# "Time-locked encryption".
tlock = ["dep:tlock", "dep:drand_core"]
# Steganographic key backup (`bury`/`exhume`): LSB-embeds a file inside a
# cover image's pixel data. Off by default so a normal build never pays for
# the image-codec dependency tree. See docs/ROADMAP.md, "Steganographic key
# backup".
stego = ["dep:image"]
# Reed-Solomon forward-error-correction sidecar for cold-storage resilience
# (`encrypt --fec` / `decrypt --fec` / `check --fec`). Off by default; no
# wire-format change, no impact on builds that don't opt in. See
# docs/ROADMAP.md, "Forward-error-correction for cold-storage resilience".
fec = ["dep:reed-solomon"]
# Encrypted, signed, hash-chained audit log for encrypt/decrypt events
# (`pqfile audit-verify`). No extra dependency - built entirely from
# existing sign/encrypt/decrypt/blake3 primitives - but off by default like
# every other niche, opt-in capability. See docs/ROADMAP.md, "Encrypted
# audit log".
audit = []

[dependencies.tokio]
version = "1"
features = ["io-util"]
optional = true

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
# Unconditional dev-dependency so the cross-implementation oracle test
# (tests/kem_oracle.rs) runs on every `cargo test`, independent of whether the
# `kem-libcrux` feature (which also depends on this crate, see [dependencies]
# above) is enabled.
libcrux-ml-kem = "0.0.10"
iai-callgrind = "0.16.1"

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "iai"
harness = false

