<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Post-quantum file encryption using ML-KEM-768 + ChaCha20-Poly1305. All encryption runs in your browser - no files are uploaded." />
  <meta name="theme-color" content="#1a1a2e" />
  <title>pqfile - Post-Quantum File Encryption</title>
  <link data-trunk rel="copy-file" href="icon.png" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <script>
    (function() {
      var img = new Image();
      img.onload = function() {
        var c = document.createElement('canvas');
        c.width = 32; c.height = 32;
        var x = c.getContext('2d');
        x.fillStyle = '#89b4fa';
        x.beginPath();
        x.roundRect(0, 0, 32, 32, 6);
        x.fill();
        x.drawImage(img, 2, 2, 28, 28);
        var l = document.createElement('link');
        l.rel = 'icon'; l.href = c.toDataURL();
        document.head.appendChild(l);
      };
      img.src = 'icon.png';
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #1a1a2e;
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #7c9adf;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-label {
      margin: 0;
      font-size: 0.85rem;
      opacity: 0.5;
      letter-spacing: 0.02em;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p class="loader-label">Loading pqfile…</p>
  </div>
  <canvas id="pqfile_canvas"></canvas>
  <script>
    // Called from Rust via wasm_bindgen after the first egui frame is rendered.
    function hide_loader() {
      var loader = document.getElementById('loader');
      if (loader) loader.classList.add('hidden');
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
