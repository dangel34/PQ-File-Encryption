[package]
name = "pqfile-gui"
version = "4.3.1"
edition = "2021"
license = "MIT"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pqfile = { workspace = true }
eframe = { workspace = true }
egui_extras = { version = "0.35", default-features = false, features = ["datepicker"] }
# Only used for the jiff::civil::Date type accepted by egui_extras's DatePickerButton;
# no clock/timezone features needed here, but this must be a direct dependency for the
# type path to be nameable (Cargo doesn't expose transitive deps' items).
jiff = { version = "0.2", default-features = false }
rfd = "0.17"
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
pem = "3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# CTAP2 USB HID for the FIDO2 second factor; optional so a default native build
# never needs libusb/hidraw. No WASM target exists for this crate.
ctap-hid-fido2 = { version = "3.5", optional = true }
# Random challenge/salt generation for FIDO2 enroll/derive; optional alongside it.
getrandom = { workspace = true, optional = true }

[features]
# Unlike `fido2` (native-hardware-only), steganographic key backup has no
# platform restriction - it works the same on native and WASM - so it's on
# by default here (both the desktop and web builds get it for free) even
# though the underlying pqfile feature is off by default at the library level.
default = ["stego"]
# FIDO2 hardware-token second factor for v10 passphrase files (desktop only;
# mirrors pqfile-cli's `fido2` feature). Off by default: pulls in hidapi
# (needs libudev-dev on Linux) purely for this one opt-in feature.
fido2 = ["dep:ctap-hid-fido2", "dep:getrandom"]
# Steganographic key backup (Bury/Exhume panel in the Keys tab). Mirrors
# pqfile's own `stego` feature (image-codec dependency tree).
stego = ["pqfile/stego"]

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "Element",
    "Node",
    "Url",
    "Blob",
    "console",
] }
js-sys = "0.3"
getrandom = { workspace = true, features = ["wasm_js"] }
# getrandom 0.2 is pulled in transitively by rand_core 0.6 (via chacha20poly1305).
# Without the js feature it refuses to compile for wasm32-unknown-unknown.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
