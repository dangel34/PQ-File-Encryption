[package]
name = "pqfile-gui"
version = "2.0.0"
edition = "2021"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pqfile = { path = "../pqfile" }
eframe = { version = "0.34", features = ["default_fonts"] }
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "Element",
    "Node",
    "Url",
    "Blob",
    "console",
] }
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
