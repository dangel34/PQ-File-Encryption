[package]
name = "pqfile-gui"
version = "3.0.0"
edition = "2021"
license = "MIT"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pqfile = { path = "../pqfile", version = "3.0.0" }
eframe = { version = "0.34", features = ["default_fonts"] }
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "Element",
    "Node",
    "Url",
    "Blob",
    "console",
] }
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
# getrandom 0.2 is pulled in transitively by rand_core 0.6 (via chacha20poly1305).
# Without the js feature it refuses to compile for wasm32-unknown-unknown.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
