[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pqfile"
version = "0.1.0"
description = "Quantum-resistant file encryption (ML-KEM, hybrid X25519+ML-KEM-768) - Python bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/dangel34/PQ-File-Encryption"
Documentation = "https://github.com/dangel34/PQ-File-Encryption/blob/main/pqfile-python/README.md"

[tool.maturin]
module-name = "pqfile._pqfile"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
test = ["pytest>=7"]
