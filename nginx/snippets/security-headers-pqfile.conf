# Security response headers for the pqfile web app.
#
# nginx does NOT merge add_header across configuration levels: if a `location`
# block defines its own add_header, it drops every add_header inherited from the
# server/http level. Because several location blocks in sites-available/pqfile set
# their own Cache-Control, this snippet must be `include`d again inside each such
# block so the security headers are not silently lost. See the site config.
#
# The CSP is kept in sync with the meta-tag backstop in pqfile-gui/index.html.
# 'wasm-unsafe-eval' is required to instantiate the WASM module; 'unsafe-inline'
# covers the small inline bootstrap scripts in index.html.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), gyroscope=(), magnetometer=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
