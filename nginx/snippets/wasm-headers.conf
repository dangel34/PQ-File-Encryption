# Cross-origin isolation headers.
#
# COOP + COEP put the document in a cross-origin-isolated context, which is what
# lets the WASM build use SharedArrayBuffer (required by the rayon-threaded code
# paths). Like the security-headers snippet, this must be re-`include`d inside any
# location block that sets its own add_header, or nginx will drop it.

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
