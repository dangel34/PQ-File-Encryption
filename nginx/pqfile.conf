server {
    listen 80;
    server_name pqfile.nappi.work;

    root /var/www/pqfile;
    index index.html;

    include snippets/security-headers-pqfile.conf;
    include snippets/wasm-headers.conf;
    include snippets/cloudflare-ips.conf;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript
               application/json application/wasm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache WASM builds — but shorter than other assets
    # since you'll likely iterate on these
    location ~* \.wasm$ {
        expires 1d;
        add_header Cache-Control "public";
        include snippets/security-headers-pqfile.conf;
    }

    location ~* \.(css|js|png|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers-pqfile.conf;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }

    # Rate Limiting
    limit_req zone=general burst=10 nodelay;
}
