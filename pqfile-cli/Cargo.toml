[package]
name = "pqfile-cli"
version = "4.3.1"
edition = "2021"
description = "Command-line interface for the pqfile quantum-resistant encryption library"
license = "MIT"
repository = "https://github.com/dangel34/PQ-File-Encryption"
homepage = "https://github.com/dangel34/PQ-File-Encryption"
autobins = false

[[bin]]
name = "pqfile"
path = "src/main.rs"

[dependencies]
pqfile        = { workspace = true }
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen   = "0.2"
# Terminal QR rendering for `keygen --qr` / `fingerprint --qr` (unicode renderer
# only; no image/svg features).
qrcode        = { version = "0.14", default-features = false }
rayon         = "1"
rpassword     = "7"
zeroize       = { version = "1", features = ["derive"] }
# CTAP2 USB HID for `--fido2`; optional so a default build never needs libusb/hidraw.
ctap-hid-fido2 = { version = "3.5", optional = true }
# Random salt generation for `fido2-enroll`; optional alongside ctap-hid-fido2.
getrandom      = { workspace = true, optional = true }

[features]
# FIDO2 hardware-token second factor for v10 (`fido2-enroll`, `--fido2` on
# encrypt/decrypt/check). Off by default: pulls in hidapi (needs libudev-dev
# on Linux) purely for this one opt-in feature.
fido2 = ["dep:ctap-hid-fido2", "dep:getrandom"]
# Time-locked encryption (`encrypt --tlock-round`, `tlock round`). Off by
# default: pulls in an HTTP stack (via pqfile's own `tlock` feature) purely
# for this one opt-in feature; no CLI-only dependency is needed.
tlock = ["pqfile/tlock"]

[dev-dependencies]
tempfile     = { workspace = true }
serde_json   = "1"

[package.metadata.deb]
maintainer = "Derek <derek@nappi.work>"
copyright = "2025"
license-file = ["../LICENSE", "0"]
extended-description = "Quantum-resistant file encryption using ML-KEM-768 and ChaCha20-Poly1305"
depends = "$auto"
section = "utils"
priority = "optional"
# Hardcoded to the target triple (rather than "../target/release/pqfile" +
# cargo-deb's auto target-dir substitution) because that substitution only
# triggers for paths starting with exactly "target/release/" - the leading
# "../" needed for a workspace member's Cargo.toml breaks the match, so
# `cargo deb --target ... --no-build` looks in plain target/release/ and
# fails to find the cross/native-built binary. release.yml only packages
# x86_64-unknown-linux-gnu today; update this if a second Linux target is added.
assets = [
  ["../target/x86_64-unknown-linux-gnu/release/pqfile", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "../target/x86_64-unknown-linux-gnu/release/pqfile", dest = "/usr/bin/pqfile", mode = "755" },
]
