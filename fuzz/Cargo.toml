[package]
name = "pqfile-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `stego` enabled here so fuzz_exhume can exercise it; the other targets are
# unaffected by the extra feature.
pqfile = { path = "../pqfile", features = ["stego"] }

[[bin]]
name = "fuzz_header_read"
path = "fuzz_targets/fuzz_header_read.rs"
test = false
doc = false

[[bin]]
name = "fuzz_decrypt_bytes"
path = "fuzz_targets/fuzz_decrypt_bytes.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pem_parsing"
path = "fuzz_targets/fuzz_pem_parsing.rs"
test = false
doc = false

[[bin]]
name = "fuzz_exhume"
path = "fuzz_targets/fuzz_exhume.rs"
test = false
doc = false
