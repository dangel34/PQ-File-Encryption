sonar.projectKey=dangel34_PQ-File-Encryption
sonar.organization=dangel34
sonar.projectName=PQ File Encryption
sonar.projectVersion=3.2.0

# Source paths for all workspace crates
sonar.sources=pqfile/src,pqfile-gui/src,pqfile-desktop/src
sonar.tests=pqfile/tests

# Exclude generated build artifacts
sonar.exclusions=**/target/**,**/*.lock

# Exclude UI rendering and launcher entry points from coverage — these require
# a live egui/GPU context and cannot be meaningfully exercised in unit tests.
sonar.coverage.exclusions=\
  pqfile/src/main.rs,\
  pqfile-gui/src/app.rs,\
  pqfile-gui/src/colors.rs,\
  pqfile-gui/src/theme.rs,\
  pqfile-gui/src/widgets.rs,\
  pqfile-gui/src/tabs/keygen.rs,\
  pqfile-gui/src/tabs/encrypt.rs,\
  pqfile-gui/src/tabs/decrypt.rs,\
  pqfile-gui/src/tabs/inspect.rs,\
  pqfile-gui/src/tabs/settings.rs,\
  pqfile-desktop/src/main.rs

# LCOV coverage report from cargo-llvm-cov
sonar.rust.lcov.reportPaths=lcov.info

sonar.sourceEncoding=UTF-8
