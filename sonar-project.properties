sonar.projectKey=dangel34_PQ-File-Encryption
sonar.organization=dangel34
sonar.projectName=PQ File Encryption
sonar.projectVersion=4.3.3

# Source paths for all workspace crates.
sonar.sources=pqfile/src,pqfile-cli/src,pqfile-gui/src,pqfile-desktop/src
sonar.tests=pqfile/tests,pqfile-cli/tests

# Exclude generated build artifacts and lockfiles.
sonar.exclusions=**/target/**,**/*.lock

# Exclude UI rendering and launcher entry points from coverage - these require a
# live egui/GPU context (or are thin CLI/launcher glue) and cannot be meaningfully
# exercised by unit tests; they're behaviorally covered by integration tests
# (pqfile-cli/tests/roundtrip.rs) instead. The crypto core (pqfile/src) stays
# fully measured. pqfile-cli/src/main.rs was split into commands/ (one module
# per subcommand handler) plus interactive.rs (no-args guided prompt mode) and
# prompts.rs (terminal passphrase prompting); all three carry the same "thin
# glue, integration-tested" character main.rs itself still has and are
# excluded for the same reason - config.rs, json_util.rs, and io_util.rs stay
# measured since they have real, meaningful unit tests.
sonar.coverage.exclusions=\
  pqfile-gui/**,\
  pqfile-desktop/**,\
  pqfile-cli/src/main.rs,\
  pqfile-cli/src/interactive.rs,\
  pqfile-cli/src/prompts.rs,\
  pqfile-cli/src/commands/**

# LCOV coverage report produced by the SonarQube workflow's cargo-llvm-cov step.
sonar.rust.lcov.reportPaths=lcov.info

sonar.sourceEncoding=UTF-8
