name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'STABILITY.md'
      - '.gitleaks.toml'
      - 'supply-chain/imports.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'STABILITY.md'
      - '.gitleaks.toml'
      - 'supply-chain/imports.lock'
      - '.github/workflows/**'

# Cancel any in-progress run for the same ref so rapid pushes don't pile up.
# The bench job overrides this with its own group so a push never cancels a
# benchmark that is mid-write to gh-pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Supply-chain and license policy ────────────────────────────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
          # advisories: block on known RustSec vulnerabilities
          # licenses:   enforce the allow-list in deny.toml
          # bans:       catch duplicate crates and banned dependencies
          # sources:    only allow crates.io
          command-arguments: "advisories licenses bans sources"

  # ── Supply-chain vetting (main only) ───────────────────────────────────────
  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-vet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-vet-

      - name: Install cargo-vet
        uses: taiki-e/install-action@682e7d9e49c5e653d371fc6adbda67653461378a # v2.82.4
        with:
          # Pinned: no GitHub release binary exists past v0.10.0, so an
          # unpinned "latest" silently resolves to that stale binary. Pinning
          # to the crates.io-latest version here forces a from-source build
          # via cargo install, keeping CI's TOML formatter in sync with what
          # `cargo vet fmt` produces locally (the on-disk format changed
          # between patch releases) instead of fighting itself every run.
          tool: cargo-vet@0.10.2

      - name: Run cargo vet
        run: cargo vet --locked

  # ── Benchmark regression detection (main only) ────────────────────────────
  bench:
    name: bench
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Own concurrency group so a rapid push never cancels a benchmark that is
    # mid-write to gh-pages, which would corrupt the benchmark history.
    concurrency:
      group: bench-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            git checkout --orphan gh-pages
            git reset --hard
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "chore: initialize gh-pages for benchmark history"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Run benchmarks
        run: cargo bench -p pqfile --bench crypto -- --output-format bencher --measurement-time 5 --warm-up-time 2 2>&1 | tee bench_output.txt

      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@dangel34'

  # ── Secret scanning ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Test suite + Lint ──────────────────────────────────────────────────────
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@682e7d9e49c5e653d371fc6adbda67653461378a # v2.82.4
        with:
          tool: cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Cache Cargo registry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features pqfile/async -- --deny warnings

      # PRs: reuse clippy's compiled artifacts - no instrumentation overhead.
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: cargo test --workspace --features pqfile/async

      # Main pushes: instrument for coverage reporting.
      - name: Run tests with coverage
        if: github.event_name == 'push'
        run: cargo llvm-cov --workspace --features pqfile/async --summary-only

  # ── WASM smoke test ────────────────────────────────────────────────────────
  wasm-test:
    name: WASM smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@682e7d9e49c5e653d371fc6adbda67653461378a # v2.82.4
        with:
          tool: wasm-pack

      - name: Cache Cargo registry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-test-

      - name: Run WASM smoke tests (Node.js)
        run: wasm-pack test --node pqfile --test wasm_smoke
