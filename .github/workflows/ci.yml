name: CI

# Note: workflow files are deliberately NOT in paths-ignore. A push that only
# edits a workflow still runs the full suite — a broken workflow edit landing
# with zero checks is how the June 2026 release-pipeline breakage went unnoticed.
#
# Related checks that do NOT run here (moved to a weekly schedule on
# 2026-07-21 to cut recurring CI-minutes cost): the off-by-default cargo
# feature compile/test checks (feature-checks.yml), the deterministic
# instruction-count benchmark gate (iai-bench.yml), and the SonarQube
# coverage scan (sonarqube.yml). All three still have workflow_dispatch for
# an on-demand run.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitleaks.toml'
      - 'supply-chain/imports.lock'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitleaks.toml'
      - 'supply-chain/imports.lock'

# Cancel any in-progress run for the same ref so rapid pushes don't pile up.
# The bench job overrides this with its own group so a push never cancels a
# benchmark that is mid-write to gh-pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Supply-chain and license policy ────────────────────────────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # advisories: block on known RustSec vulnerabilities
          # licenses:   enforce the allow-list in deny.toml
          # bans:       catch duplicate crates and banned dependencies
          # sources:    only allow crates.io
          command-arguments: "advisories licenses bans sources"

  # ── Supply-chain vetting ───────────────────────────────────────────────────
  # Runs on PRs as well as pushes so it can be marked a required status check;
  # a required check that only runs on push would block every PR forever.
  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: vet

      - name: Install cargo-vet
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          # Pinned: no GitHub release binary exists past v0.10.0, so an
          # unpinned "latest" silently resolves to that stale binary. Pinning
          # to the crates.io-latest version here forces a from-source build
          # via cargo install, keeping CI's TOML formatter in sync with what
          # `cargo vet fmt` produces locally (the on-disk format changed
          # between patch releases) instead of fighting itself every run.
          tool: cargo-vet@0.10.2

      - name: Run cargo vet
        run: cargo vet --locked

  # ── API stability gate ─────────────────────────────────────────────────────
  # STABILITY.md makes a formal semver promise for the pqfile library crate and
  # nothing verified it mechanically until this job. cargo-semver-checks
  # compares the current API against the latest published pqfile on crates.io
  # (fetched automatically as the baseline) via rustdoc JSON. Library crate
  # only: pqfile-cli and the GUI crates make no API promise (see STABILITY.md).
  # An intentional break passes as soon as the version is bumped to the next
  # major, so this never blocks a planned v5.0.
  cargo-semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: semver

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-semver-checks

      # --all-features so the async API surface is covered too.
      # --release-type minor: between releases the tree accumulates additive
      # API (the version is only bumped at release time), so this job asserts
      # "valid as a minor release", i.e. fails only on breaking changes. The
      # publish.yml gate runs with the default inference against the stamped
      # release version, which also rejects additions without a minor bump.
      - name: Check pqfile API against latest published version
        run: cargo semver-checks --package pqfile --all-features --release-type minor

  # ── Workflow security audit ────────────────────────────────────────────────
  # Pinned actions do not catch template injection, credential persistence,
  # over-broad token permissions, or cache-poisoning vectors; zizmor audits
  # the workflow files themselves for all of these. GH_TOKEN enables the
  # online audits (ref confusion, stale action pins) as well.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor==1.26.1

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --gh-token "$GH_TOKEN" .github/workflows/

  # ── Benchmark regression detection (main only) ────────────────────────────
  bench:
    name: bench
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Own concurrency group so a rapid push never cancels a benchmark that is
    # mid-write to gh-pages, which would corrupt the benchmark history.
    concurrency:
      group: bench-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Credentials stay persisted here (zizmor artipacked): the step below
      # pushes the gh-pages branch and github-action-benchmark auto-pushes
      # benchmark history to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: bench
          cache-target: "true"

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            git checkout --orphan gh-pages
            git reset --hard
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "chore: initialize gh-pages for benchmark history"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Run benchmarks
        run: cargo bench -p pqfile --bench crypto -- --output-format bencher --measurement-time 5 --warm-up-time 2 2>&1 | tee bench_output.txt

      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '125%'
          comment-on-alert: true
          # Comment-only, not a merge gate: this job's wall-clock criterion
          # numbers only ever compare against the single most recent data
          # point on a shared ubuntu-latest runner, and the natural run-to-run
          # noise band (observed ~1.6x peak-to-trough across two dozen
          # otherwise-unremarkable commits, e.g. encrypt_bytes/1024 ranging
          # 43539-73175 ns) already exceeds the 125% alert-threshold on its
          # own, independent of any real code change (see the 2026-07-23
          # false alarm off of 8a11715's outlier-fast run). The deterministic
          # iai-callgrind job (iai-bench.yml) is the actual regression gate;
          # this job stays as a human-readable trend/comment.
          fail-on-alert: false
          alert-comment-cc-users: '@dangel34'

  # ── Secret scanning ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Test suite + Lint ──────────────────────────────────────────────────────
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: test
          cache-target: "true"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features pqfile/async -- --deny warnings

      # Reuses clippy's compiled artifacts - no instrumentation overhead.
      # Coverage reporting lives solely in sonarqube.yml now; running it here
      # too was a duplicate full-suite instrumented run on every push.
      - name: Run tests
        run: cargo test --workspace --features pqfile/async

  # ── WASM smoke test ────────────────────────────────────────────────────────
  wasm-test:
    name: WASM smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: wasm-pack

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: wasm-test
          cache-target: "true"

      - name: Run WASM smoke tests (Node.js)
        run: wasm-pack test --node pqfile --test wasm_smoke

  # ── Language bindings ──────────────────────────────────────────────────────
  # pqfile-python, pqfile-node, and pqfile-mobile are each their own Cargo
  # workspace (excluded from the root one - see the root Cargo.toml `exclude`
  # comments) so that a plain `cargo build --workspace` above never needs
  # Python/Node/Android-NDK toolchains. That exclusion also means nothing
  # above exercises them, so without these three jobs they'd have zero CI
  # coverage and could silently bit-rot behind a `pqfile` core change. Ubuntu
  # only, matching every other job in this file (cross-platform validation
  # happens in release.yml, not here) - and Linux-only is also simply all
  # pqfile-mobile could ever cover anyway, since Android/iOS packaging needs
  # the NDK and Xcode respectively (see pqfile-mobile/README.md).
  bindings-python:
    name: pqfile-python (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pqfile-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: bindings-python

      # maturin's `develop` command installs into whichever Python is first
      # on PATH, so a venv + $GITHUB_PATH (rather than sourcing an activate
      # script, which wouldn't persist to later steps anyway) is enough to
      # scope it instead of touching the runner's system Python.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Exact version pins (not floating on "latest") plus --only-binary
      # :all: so pip only ever installs prebuilt wheels, never a source
      # distribution that could run arbitrary code from its own setup.py/
      # build backend during install.
      - name: Install maturin and pytest
        run: pip install --only-binary ":all:" maturin==1.14.1 pytest==9.1.1

      - name: Build the extension module
        run: maturin develop --release

      - name: Run tests
        run: pytest -v

  bindings-node:
    name: pqfile-node (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pqfile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: bindings-node

      # npm ci (not install): fails rather than silently updating the
      # lockfile if package.json/package-lock.json ever drift out of sync.
      # --ignore-scripts: nothing in this dependency tree (just
      # @napi-rs/cli) has an install-time lifecycle script.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build the native addon
        run: npm run build

      - name: Run tests
        run: npm test

  bindings-mobile:
    name: pqfile-mobile (build + test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pqfile-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: bindings-mobile

      # The Rust-level tests are the real verification here (they call the
      # exact functions uniffi exports, directly). There is no Kotlin/Swift
      # toolchain available to drive the FFI boundary itself from CI - the
      # bindgen step below only proves the exported interface still generates
      # valid Kotlin/Swift source, not that either compiles or runs.
      # --locked on every cargo invocation in this job: fail instead of
      # silently re-resolving dependencies if pqfile-mobile/Cargo.lock ever
      # drifts out of sync with Cargo.toml.
      - name: Run tests
        run: cargo test --release --locked

      - name: Generate Kotlin and Swift bindings (sanity check only)
        run: |
          cargo build --release --locked
          cargo run --release --locked --bin uniffi-bindgen -- generate \
            --library target/release/libpqfile_mobile.so \
            --language kotlin --out-dir bindings/kotlin
          cargo run --release --locked --bin uniffi-bindgen -- generate \
            --library target/release/libpqfile_mobile.so \
            --language swift --out-dir bindings/swift
