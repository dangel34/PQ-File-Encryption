name: CI

# Note: workflow files are deliberately NOT in paths-ignore. A push that only
# edits a workflow still runs the full suite — a broken workflow edit landing
# with zero checks is how the June 2026 release-pipeline breakage went unnoticed.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitleaks.toml'
      - 'supply-chain/imports.lock'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitleaks.toml'
      - 'supply-chain/imports.lock'

# Cancel any in-progress run for the same ref so rapid pushes don't pile up.
# The bench job overrides this with its own group so a push never cancels a
# benchmark that is mid-write to gh-pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Supply-chain and license policy ────────────────────────────────────────
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # advisories: block on known RustSec vulnerabilities
          # licenses:   enforce the allow-list in deny.toml
          # bans:       catch duplicate crates and banned dependencies
          # sources:    only allow crates.io
          command-arguments: "advisories licenses bans sources"

  # ── Supply-chain vetting ───────────────────────────────────────────────────
  # Runs on PRs as well as pushes so it can be marked a required status check;
  # a required check that only runs on push would block every PR forever.
  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: vet

      - name: Install cargo-vet
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          # Pinned: no GitHub release binary exists past v0.10.0, so an
          # unpinned "latest" silently resolves to that stale binary. Pinning
          # to the crates.io-latest version here forces a from-source build
          # via cargo install, keeping CI's TOML formatter in sync with what
          # `cargo vet fmt` produces locally (the on-disk format changed
          # between patch releases) instead of fighting itself every run.
          tool: cargo-vet@0.10.2

      - name: Run cargo vet
        run: cargo vet --locked

  # ── API stability gate ─────────────────────────────────────────────────────
  # STABILITY.md makes a formal semver promise for the pqfile library crate and
  # nothing verified it mechanically until this job. cargo-semver-checks
  # compares the current API against the latest published pqfile on crates.io
  # (fetched automatically as the baseline) via rustdoc JSON. Library crate
  # only: pqfile-cli and the GUI crates make no API promise (see STABILITY.md).
  # An intentional break passes as soon as the version is bumped to the next
  # major, so this never blocks a planned v5.0.
  cargo-semver-checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: semver

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: cargo-semver-checks

      # --all-features so the async API surface is covered too.
      # --release-type minor: between releases the tree accumulates additive
      # API (the version is only bumped at release time), so this job asserts
      # "valid as a minor release", i.e. fails only on breaking changes. The
      # publish.yml gate runs with the default inference against the stamped
      # release version, which also rejects additions without a minor bump.
      - name: Check pqfile API against latest published version
        run: cargo semver-checks --package pqfile --all-features --release-type minor

  # ── Workflow security audit ────────────────────────────────────────────────
  # Pinned actions do not catch template injection, credential persistence,
  # over-broad token permissions, or cache-poisoning vectors; zizmor audits
  # the workflow files themselves for all of these. GH_TOKEN enables the
  # online audits (ref confusion, stale action pins) as well.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor==1.26.1

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --gh-token "$GH_TOKEN" .github/workflows/

  # ── Benchmark regression detection (main only) ────────────────────────────
  bench:
    name: bench
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Own concurrency group so a rapid push never cancels a benchmark that is
    # mid-write to gh-pages, which would corrupt the benchmark history.
    concurrency:
      group: bench-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Credentials stay persisted here (zizmor artipacked): the step below
      # pushes the gh-pages branch and github-action-benchmark auto-pushes
      # benchmark history to it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: bench
          cache-target: "true"

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            git checkout --orphan gh-pages
            git reset --hard
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "chore: initialize gh-pages for benchmark history"
            git push origin gh-pages
            git checkout "$GITHUB_SHA"
          fi

      - name: Run benchmarks
        run: cargo bench -p pqfile --bench crypto -- --output-format bencher --measurement-time 5 --warm-up-time 2 2>&1 | tee bench_output.txt

      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: cargo
          output-file-path: bench_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@dangel34'

  # ── Deterministic benchmark gate (instruction counts, main and PRs) ───────
  # Complements the wall-clock `bench` job above: criterion's timings are noisy
  # on shared runners, so the regression threshold there is loose (125%).
  # iai-callgrind counts instructions under Valgrind, which is deterministic
  # on the same binary, so the gate here can be tight (5%, set per-benchmark
  # in pqfile/benches/iai.rs via Callgrind::soft_limits). The comparison
  # baseline is target/iai/ from the previous run, restored by the cache
  # below; a cold cache (first run, or after a Cargo.lock change evicts the
  # exact-match key) just skips the regression check for that one run.
  iai-bench:
    name: iai-bench
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install iai-callgrind-runner
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          # Must exactly match the iai-callgrind version in pqfile/Cargo.toml
          # (dev-dependency) - a mismatch is a hard error at bench-run time.
          tool: iai-callgrind-runner@0.16.1

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: iai
          cache-target: "true"

      - name: Run iai-callgrind benchmarks
        run: cargo bench -p pqfile --bench iai

  # ── Secret scanning ────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # full history so gitleaks can scan all commits
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Test suite + Lint ──────────────────────────────────────────────────────
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: test
          cache-target: "true"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features pqfile/async -- --deny warnings

      # Reuses clippy's compiled artifacts - no instrumentation overhead.
      # Coverage reporting lives solely in sonarqube.yml now; running it here
      # too was a duplicate full-suite instrumented run on every push.
      - name: Run tests
        run: cargo test --workspace --features pqfile/async

  # ── Optional-feature compile check (fido2) ────────────────────────────────
  # The `fido2` feature is off by default so the main test-and-lint job never
  # needs libusb/hidraw system packages; this job exists purely so the
  # feature-gated code doesn't silently bit-rot between uses. Native HID
  # hardware isn't available on a CI runner, so this checks compilation and
  # the feature's own unit tests (enrollment file parsing), not live USB I/O.
  fido2-check:
    name: fido2 feature check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: clippy

      - uses: ./.github/actions/install-linux-deps

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: fido2
          cache-target: "true"

      - name: Clippy (pqfile-cli, fido2 feature)
        run: cargo clippy -p pqfile-cli --all-targets --features fido2 -- --deny warnings

      - name: Test (pqfile-cli, fido2 feature)
        run: cargo test -p pqfile-cli --features fido2

      # pqfile-desktop always enables pqfile-gui's fido2 feature (it's the one
      # native GUI target), so the main test-and-lint job already builds it
      # with FIDO2 code compiled in via --workspace. What it does not do is
      # run pqfile-gui's OWN test binary with the feature on (that requires
      # passing the feature to pqfile-gui specifically), so fido2.rs's unit
      # tests (enrollment file parsing) need this separate invocation.
      - name: Clippy (pqfile-gui, fido2 feature)
        run: cargo clippy -p pqfile-gui --all-targets --features fido2 -- --deny warnings

      - name: Test (pqfile-gui, fido2 feature)
        run: cargo test -p pqfile-gui --features fido2

  # ── Optional-feature compile check (kem-libcrux) ──────────────────────────
  # The `kem-libcrux` feature swaps the ML-KEM backend from `ml-kem` to
  # Cryspen's F*-verified `libcrux-ml-kem`; off by default so a normal build
  # never pays for the extra dependency tree. This job exists purely so the
  # feature-gated code doesn't silently bit-rot between uses - library crate
  # only, since the feature is a pqfile implementation detail with no CLI/GUI
  # surface. pqfile/tests/kem_oracle.rs (a plain dev-dependency, unaffected by
  # this feature) already proves the two backends agree byte-for-byte.
  kem-libcrux-check:
    name: kem-libcrux feature check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: clippy

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: kem-libcrux
          cache-target: "true"

      - name: Clippy (pqfile, kem-libcrux feature)
        run: cargo clippy -p pqfile --all-targets --features kem-libcrux -- --deny warnings

      - name: Test (pqfile, kem-libcrux feature)
        run: cargo test -p pqfile --features kem-libcrux

  # ── Optional-feature compile check (tlock) ────────────────────────────────
  # Time-locked encryption (V11 format) pulls in the only network-capable
  # dependencies in the workspace (`tlock`, `drand_core`); off by default so a
  # normal build never gains an HTTP stack. This job compiles and runs the
  # feature's offline unit tests (a pinned historical drand beacon signature,
  # so no network access is needed here) for both the library and the CLI.
  # The two live-network tests in pqfile/src/tlock.rs are #[ignore]d and never
  # run in CI, per the same convention as the ct_*.rs dudect harnesses.
  tlock-check:
    name: tlock feature check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: clippy

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: tlock
          cache-target: "true"

      - name: Clippy (pqfile, tlock feature)
        run: cargo clippy -p pqfile --all-targets --features tlock -- --deny warnings

      - name: Test (pqfile, tlock feature)
        run: cargo test -p pqfile --features tlock

      - name: Clippy (pqfile-cli, tlock feature)
        run: cargo clippy -p pqfile-cli --all-targets --features tlock -- --deny warnings

      - name: Test (pqfile-cli, tlock feature)
        run: cargo test -p pqfile-cli --features tlock

  # ── Optional-feature compile check (stego) ────────────────────────────────
  # Steganographic key backup (`bury`/`exhume`) pulls in an image-codec
  # dependency tree (PNG + JPEG decode/encode); off by default so a normal
  # build never pays for it. This job compiles and runs the feature's own
  # unit tests (LSB embed/extract round-trips, capacity, tamper detection)
  # for both the library and the CLI.
  stego-check:
    name: stego feature check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: clippy

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: stego
          cache-target: "true"

      - name: Clippy (pqfile, stego feature)
        run: cargo clippy -p pqfile --all-targets --features stego -- --deny warnings

      - name: Test (pqfile, stego feature)
        run: cargo test -p pqfile --features stego

      - name: Clippy (pqfile-cli, stego feature)
        run: cargo clippy -p pqfile-cli --all-targets --features stego -- --deny warnings

      - name: Test (pqfile-cli, stego feature)
        run: cargo test -p pqfile-cli --features stego

  # ── WASM smoke test ────────────────────────────────────────────────────────
  wasm-test:
    name: WASM smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: wasm-pack

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: wasm-test
          cache-target: "true"

      - name: Run WASM smoke tests (Node.js)
        run: wasm-pack test --node pqfile --test wasm_smoke
