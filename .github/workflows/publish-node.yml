name: Publish Node.js bindings

# Ran for real for the first time with the v4.3.3 release (2026-07-24):
# `@dangel34/pqfile` and `@dangel34/pqfile-win32-x64-msvc` are published and
# live on npm via this workflow's OIDC Trusted Publishing, no stored token.
# The macOS/Linux legs of the *build* matrix have still only ever been
# cross-checked by reading napi-rs's own source, not built on this repo's
# Windows dev machine - only x86_64-pc-windows-msvc has actually been built
# here. The other three platform packages (darwin-x64, darwin-arm64,
# linux-x64-gnu) don't exist on npm yet; each needs its own one-off manual
# bootstrap publish (see pqfile-node/README.md) from a machine that can
# build for that platform before this workflow can publish it automatically -
# same reason `@dangel34/pqfile-win32-x64-msvc` itself needed one first.
#
# Fires once a GitHub Release is published (human-gated), mirroring
# publish.yml's crates.io convention and publish-python.yml. Builds the
# native addon per platform (matching package.json's `napi.triples`), then
# arranges them into napi-rs's standard per-platform optionalDependencies
# packages (`napi create-npm-dir` / `napi artifacts`) and publishes all of
# them plus the main `@dangel34/pqfile` package (`napi prepublish`, plus an
# explicit `npm publish` for the root package - see the `publish` job below
# for why that's separate). aarch64-linux-gnu is deliberately not in the
# target list yet - cross-compiling it needs a zig toolchain step this
# hasn't been wired up for, see pqfile-node/README.md.
#
# Publishes via npm Trusted Publishing (OIDC) rather than a stored token -
# npm's own token-creation UI now warns against a 2FA-bypass automation token
# for CI and points at Trusted Publishing instead, so there is no NPM_TOKEN
# secret here at all. Unlike PyPI's "pending publisher" (which can be
# registered before the project exists), npm's Trusted Publisher can only be
# configured from an existing package's own Settings page, so the very first
# publish of each package name has to happen manually first: `napi
# prepublish`'s own automated flow can't complete npm's browser-based OTP
# challenge either (it shells out to `npm publish` as a non-interactive
# subprocess, which just errors on EOTP), so that first publish is a plain,
# interactive `npm publish` per package from a maintainer's own authenticated
# npm login. That bootstrap is also what surfaced the package needing to be
# renamed to the scoped `@dangel34/pqfile` in the first place (npm rejected
# the unscoped "pqfile" as too similar to the existing "vfile" package, and
# separately flagged the platform-specific unscoped name via its
# spam-detection heuristic - the scoped rename fixed both at once).
on:
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        working-directory: pqfile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # package-manager-cache disabled: this workflow only runs on a published
      # release (human-gated, touching npm-publish credentials), and
      # setup-node's automatic caching is a cache-poisoning vector zizmor
      # flags in that context - a cache entry planted by an earlier,
      # untrusted run could get restored here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # npm ci (not install): fails rather than silently updating the lockfile
      # if package.json and package-lock.json ever drift out of sync.
      # --ignore-scripts: nothing in this dependency tree (just @napi-rs/cli)
      # has an install-time lifecycle script, confirmed by checking
      # package-lock.json's hasInstallScript markers - so this only removes a
      # supply-chain execution surface, it doesn't change what gets installed.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # --no-install: use the @napi-rs/cli devDependency `npm ci` just
      # resolved from package-lock.json, rather than letting npx fetch
      # whatever "napi" currently resolves to on the registry (and run its
      # lifecycle scripts) if it weren't already present locally.
      - name: Build native addon
        run: npx --no-install napi build --platform --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: pqfile-node/*.node

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    # id-token: write lets the npm CLI mint the OIDC token npm's Trusted
    # Publishing exchanges for a short-lived publish credential - no
    # NPM_TOKEN secret needed. Requires npm's "Trusted Publisher" registered
    # on the @dangel34/pqfile package (npmjs.com -> package -> Settings -> Trusted
    # Publisher): GitHub Actions, owner dangel34, repo PQ-File-Encryption,
    # workflow publish-node.yml, environment release.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: pqfile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1; actions/setup-node's Node 22
      # ships whatever npm shipped with that Node release, which may predate
      # it - pin an exact, known-sufficient version rather than floating on
      # `@latest` (which would resolve to a different, unreviewed npm release
      # on every run) or hoping the bundled version is new enough.
      # --ignore-scripts: npm's own package has no install-time lifecycle
      # scripts; harmless to disable here too for consistency.
      - name: Update npm
        run: npm install -g npm@12.0.1 --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: pqfile-node/artifacts

      # npm ci --ignore-scripts, same reasoning as the build job above.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Idempotency guard, matching publish.yml's crates.io check and
      # publish-python.yml's PyPI check: skip anything already on npm so
      # re-running after a partial failure or accidental double-trigger is
      # always safe.
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Scoped package: the registry API needs the `/` between scope and
          # name URL-encoded (%2f) - an unencoded slash is parsed as a version
          # segment instead and the request 504s rather than 404ing cleanly.
          http=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@dangel34%2fpqfile/${VERSION}")
          if [ "$http" = "200" ]; then
            echo "@dangel34/pqfile $VERSION already on npm -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "@dangel34/pqfile $VERSION not yet on npm -- will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Creates npm/<platform>/ per-target package directories from the
      # `napi.triples` config in package.json, then copies each downloaded
      # .node file into the matching directory.
      - name: Arrange per-platform packages
        if: steps.check.outputs.skip == 'false'
        run: |
          npx --no-install napi create-npm-dir -t .
          npx --no-install napi artifacts --dir artifacts

      # Bumps every npm/<platform>/package.json to the root version and runs
      # `npm publish` for each one. No NODE_AUTH_TOKEN here - the pinned npm
      # CLI performs the OIDC exchange itself using the id-token: write
      # permission above.
      #
      # `napi prepublish` only ever publishes the per-platform packages in
      # this loop - confirmed by reading its source
      # (@napi-rs/cli/scripts/index.js's PrePublishCommand.execute()) after a
      # manual bootstrap publish needed an extra `npm publish` step this
      # command never performed. It does still handle updating the root
      # package.json's `optionalDependencies` to point at the platform
      # packages' versions, which the explicit `npm publish` below depends on.
      - name: Publish per-platform packages
        if: steps.check.outputs.skip == 'false'
        run: npx --no-install napi prepublish -p npm --skip-gh-release

      # napi prepublish (above) never publishes the root package itself - see
      # its comment. Do that explicitly here.
      - name: Publish the main package
        if: steps.check.outputs.skip == 'false'
        run: npm publish
