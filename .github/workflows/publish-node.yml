name: Publish Node.js bindings

# `@dangel34/pqfile` and `@dangel34/pqfile-win32-x64-msvc` 0.1.0 were
# bootstrapped onto npm by hand for v4.3.3 (2026-07-24). The v4.3.3 and v4.3.4
# runs of this workflow both stopped at the "already on npm" guard because the
# binding version never moved, so 4.3.5 (bindings now versioned in lockstep
# with the core crate) is the first run that actually publishes anything. The
# other three platform packages (darwin-x64, darwin-arm64, linux-x64-gnu)
# still don't exist on npm; each needs its own one-off manual bootstrap
# publish (see pqfile-node/README.md) before this workflow can publish it
# automatically - until then the publish step skips them with a warning.
#
# Fires once a GitHub Release is published (human-gated), mirroring
# publish.yml's crates.io convention and publish-python.yml. Builds the
# native addon per platform (matching package.json's `napi.targets`), then
# arranges them into napi-rs's standard per-platform optionalDependencies
# packages (`napi create-npm-dirs` / `napi artifacts`) and publishes each of
# them plus the main `@dangel34/pqfile` package with plain `npm publish` -
# see the `publish` job below. aarch64-linux-gnu is deliberately not in the
# target list yet - cross-compiling it needs a zig toolchain step this
# hasn't been wired up for, see pqfile-node/README.md.
#
# Publishes via npm Trusted Publishing (OIDC) rather than a stored token -
# npm's own token-creation UI now warns against a 2FA-bypass automation token
# for CI and points at Trusted Publishing instead, so there is no NPM_TOKEN
# secret here at all. Unlike PyPI's "pending publisher" (which can be
# registered before the project exists), npm's Trusted Publisher can only be
# configured from an existing package's own Settings page, so the very first
# publish of each package name has to happen manually first: an automated
# `npm publish` can't complete npm's browser-based OTP challenge either (a
# non-interactive run just errors on EOTP), so that first publish is a plain,
# interactive `npm publish` per package from a maintainer's own authenticated
# npm login. That bootstrap is also what surfaced the package needing to be
# renamed to the scoped `@dangel34/pqfile` in the first place (npm rejected
# the unscoped "pqfile" as too similar to the existing "vfile" package, and
# separately flagged the platform-specific unscoped name via its
# spam-detection heuristic - the scoped rename fixed both at once).
on:
  release:
    types: [published]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        working-directory: pqfile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # package-manager-cache disabled: this workflow only runs on a published
      # release (human-gated, touching npm-publish credentials), and
      # setup-node's automatic caching is a cache-poisoning vector zizmor
      # flags in that context - a cache entry planted by an earlier,
      # untrusted run could get restored here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # npm ci (not install): fails rather than silently updating the lockfile
      # if package.json and package-lock.json ever drift out of sync.
      # --ignore-scripts: nothing in this dependency tree (just @napi-rs/cli)
      # has an install-time lifecycle script, confirmed by checking
      # package-lock.json's hasInstallScript markers - so this only removes a
      # supply-chain execution surface, it doesn't change what gets installed.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # --no-install: use the @napi-rs/cli devDependency `npm ci` just
      # resolved from package-lock.json, rather than letting npx fetch
      # whatever "napi" currently resolves to on the registry (and run its
      # lifecycle scripts) if it weren't already present locally.
      - name: Build native addon
        run: npx --no-install napi build --platform --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: pqfile-node/*.node

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    # id-token: write lets the npm CLI mint the OIDC token npm's Trusted
    # Publishing exchanges for a short-lived publish credential - no
    # NPM_TOKEN secret needed. Requires npm's "Trusted Publisher" registered
    # on the @dangel34/pqfile package (npmjs.com -> package -> Settings -> Trusted
    # Publisher): GitHub Actions, owner dangel34, repo PQ-File-Encryption,
    # workflow publish-node.yml, environment release.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: pqfile-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1; actions/setup-node's Node 22
      # ships whatever npm shipped with that Node release, which may predate
      # it - pin an exact, known-sufficient version rather than floating on
      # `@latest` (which would resolve to a different, unreviewed npm release
      # on every run) or hoping the bundled version is new enough.
      # --ignore-scripts: npm's own package has no install-time lifecycle
      # scripts; harmless to disable here too for consistency.
      - name: Update npm
        run: npm install -g npm@12.0.1 --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bindings-*
          path: pqfile-node/artifacts

      # npm ci --ignore-scripts, same reasoning as the build job above.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # Bindings are versioned in lockstep with the core crate (see
      # docs/RELEASING.md). Before 4.3.5 they were stuck at 0.1.0, so the
      # v4.3.4 run "succeeded" by skipping a version that already existed
      # and the 4.3.4 binding fix never shipped. Fail loudly instead of
      # silently skipping whenever the manifest doesn't match the tag.
      - name: Check package.json version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "::error::pqfile-node/package.json is $VERSION but the release tag is $TAG - run scripts/bump-version.ps1, which bumps the bindings too"
            exit 1
          fi
          # Every optionalDependencies entry must point at this same version,
          # or the root package would install a stale native addon.
          node -e '
            const p = require("./package.json");
            const bad = Object.entries(p.optionalDependencies || {}).filter(([, v]) => v !== p.version);
            if (bad.length) { console.log("::error::optionalDependencies out of sync: " + JSON.stringify(bad)); process.exit(1); }
          '

      # Idempotency guard, matching publish.yml's crates.io check and
      # publish-python.yml's PyPI check: skip anything already on npm so
      # re-running after a partial failure or accidental double-trigger is
      # always safe.
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Scoped package: the registry API needs the `/` between scope and
          # name URL-encoded (%2f) - an unencoded slash is parsed as a version
          # segment instead and the request 504s rather than 404ing cleanly.
          http=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@dangel34%2fpqfile/${VERSION}")
          if [ "$http" = "200" ]; then
            echo "@dangel34/pqfile $VERSION already on npm -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "@dangel34/pqfile $VERSION not yet on npm -- will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Creates npm/<platform>/ per-target package directories (versioned to
      # match the root package.json) from the `napi.targets` list, then copies
      # each downloaded .node file into the matching directory. `napi
      # artifacts` errors out if any configured target's .node is missing, so
      # a failed build leg can't produce a partial publish.
      #
      # @napi-rs/cli 3.x renamed `create-npm-dir` -> `create-npm-dirs` and
      # `prepublish` -> `pre-publish`, and dropped the old `napi.triples`
      # config. Neither publish path had actually executed in CI before 4.3.5
      # (both earlier runs hit the "already on npm" skip above), so the old
      # commands were never caught failing.
      - name: Arrange per-platform packages
        if: steps.check.outputs.skip == 'false'
        run: |
          npx --no-install napi create-npm-dirs
          npx --no-install napi artifacts

      # Publishes each npm/<platform>/ package directly rather than through
      # `napi pre-publish`, so a platform package that has never existed on npm
      # is skipped with a warning instead of failing the job: npm Trusted
      # Publishing can only be configured on an existing package, so each new
      # platform package needs a one-off manual bootstrap publish first (see
      # pqfile-node/README.md). No NODE_AUTH_TOKEN here - the pinned npm CLI
      # performs the OIDC exchange itself using the id-token: write
      # permission above.
      - name: Publish per-platform packages
        if: steps.check.outputs.skip == 'false'
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            encoded="${name/\//%2f}"
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${encoded}/${version}")" = "200" ]; then
              echo "$name@$version already on npm -- skipping"
              continue
            fi
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${encoded}")" != "200" ]; then
              echo "::warning::$name has never been published to npm. Trusted Publishing cannot create a new package, so it needs a one-off manual bootstrap publish (see pqfile-node/README.md). Skipping it for this release."
              continue
            fi
            (cd "$dir" && npm publish)
          done

      # The platform loop above never publishes the root package itself. Do
      # that explicitly here, last, so it never points at a platform package
      # version that failed to publish.
      - name: Publish the main package
        if: steps.check.outputs.skip == 'false'
        run: npm publish
