name: Mutation Testing

# Run nightly and on manual dispatch. Not run on every push/PR because
# cargo-mutants is CPU-intensive (can take 20-40 minutes on the full set).
#
# Scope is intentionally limited to the four crypto-critical modules where a
# surviving mutant is a genuine test gap. Any survivor should result in a new
# regression test before the next release.
on:
  schedule:
    - cron: '0 3 * * 1'  # 03:00 UTC every Monday
  workflow_dispatch:
    inputs:
      extra_flags:
        description: 'Extra cargo-mutants flags (e.g. "--timeout 30")'
        required: false
        default: ''

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants (crypto-critical paths)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-mutants-

      # No GUI system deps needed: mutation scope is pqfile (core library only),
      # which has no GTK/XCB dependencies.

      - name: Install cargo-mutants
        uses: taiki-e/install-action@682e7d9e49c5e653d371fc6adbda67653461378a # v2.82.4
        with:
          tool: cargo-mutants

      # Run mutations on the four crypto-critical modules only.
      # --jobs 4: run 4 mutations concurrently.
      # --timeout 180: kill any mutant test run that exceeds 180 seconds.
      #   The full pqfile test suite (~365 tests) takes 90-120s on ubuntu-latest
      #   because Argon2id runs at m=64MiB t=3 p=4 in production params. 180s
      #   gives a 1.5-2x buffer over the observed baseline time; most mutants
      #   still fail within the first few tests (<10s).
      # --no-shuffle: stable ordering for reproducible logs.
      - name: Run cargo-mutants on crypto-critical paths
        run: |
          cargo mutants \
            --package pqfile \
            --file pqfile/src/decrypt.rs \
            --file pqfile/src/format.rs \
            --file pqfile/src/shamir.rs \
            --file pqfile/src/passphrase.rs \
            --jobs 4 \
            --timeout 180 \
            --no-shuffle \
            ${{ github.event.inputs.extra_flags }}
        env:
          CARGO_INCREMENTAL: '0'

      - name: Upload mutants log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-log
          path: mutants.out/
          if-no-files-found: ignore
