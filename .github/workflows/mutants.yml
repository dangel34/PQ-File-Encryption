name: Mutation Testing

# Run weekly and on manual dispatch. Not run on every push/PR because
# cargo-mutants is CPU-intensive, and the full ~700-mutant set across the
# four scoped files takes too long for a single CI job - see the --shard
# comment below. Each scheduled run only covers 1/8 of the mutants, cycling
# through full coverage over ~2 months.
#
# Scope is intentionally limited to the four crypto-critical modules where a
# surviving mutant is a genuine test gap. Any survivor should result in a new
# regression test before the next release.
on:
  schedule:
    - cron: '0 3 * * 1'  # 03:00 UTC every Monday
  workflow_dispatch:
    inputs:
      extra_flags:
        description: 'Extra cargo-mutants flags (e.g. "--timeout 30")'
        required: false
        default: ''
      shard:
        description: 'Shard to run as "k/n" (e.g. "0/8"). Blank runs the full ~700-mutant set - can take 40+ hours, so only do this deliberately.'
        required: false
        default: ''

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants (crypto-critical paths)
    runs-on: ubuntu-latest
    # Explicit ceiling so a slow tail of mutants fails the job cleanly
    # instead of running into GitHub's 6h default and getting silently
    # reaped by next week's scheduled run via the concurrency group above.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: mutants

      # No GUI system deps needed: mutation scope is pqfile (core library only),
      # which has no GTK/XCB dependencies.

      - name: Install cargo-mutants
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-mutants

      # Run mutations on the four crypto-critical modules only.
      # No --jobs flag (cargo-mutants defaults to 1, i.e. one mutant test
      #   run at a time): tried --jobs 4 first, since running mutants
      #   concurrently seems like free speedup. It isn't, on a shared
      #   runner - each `cargo test` process *also* parallelizes internally
      #   across all visible CPUs, so 4 concurrent jobs x N-core internal
      #   parallelism oversubscribes the runner and each run slows to
      #   ~800s against a 204s unmutated baseline (~4x inflation). Forcing
      #   the inner parallelism down instead (--test-threads=1) just moves
      #   the cost: each run becomes fully serial and takes about as long
      #   as it did concurrently-but-contended. Either way throughput comes
      #   out the same as running one mutant at a time and letting it use
      #   the full machine - so skip the complexity and do that directly.
      # --timeout-multiplier 5 (cargo-mutants default, spelled out for
      #   clarity): each mutant gets 5x the *measured* baseline test time,
      #   rather than a fixed --timeout. A fixed --timeout also bounds the
      #   baseline run itself, so as the suite grows (e.g. SLH-DSA-192f
      #   landing pushed a from-scratch full-suite run past 180s on
      #   ubuntu-latest) it silently kills the baseline before any mutant
      #   is even tested, failing the whole job in ~4 minutes instead of
      #   running mutation testing. Scaling off the real baseline avoids
      #   needing to hand-tune this constant every time the suite changes.
      # --minimum-test-timeout 60: floor under the multiplier so a noisy
      #   runner doesn't produce a too-tight per-mutant timeout.
      # timeout-minutes on the job (above) is the actual ceiling against a
      #   runaway/hung mutant tail; most mutants still fail within the
      #   first few tests (<10s).
      # --shard k/8 on scheduled runs: even with the oversubscription fix,
      #   ~700 mutants across 4 files is too much for one CI job. Rotate
      #   through 8 shards keyed off the ISO week number so the full set
      #   gets covered roughly every 2 months instead of one run trying
      #   (and failing) to test all of it. Manual dispatch can target a
      #   specific shard via the `shard` input, or leave it blank to run
      #   the full set deliberately.
      # --no-shuffle: stable ordering, required for --shard to be
      #   deterministic across runs (and for reproducible logs).
      # extra_flags goes through an env var rather than ${{ }} interpolation
      # into the script (shell-injection vector, zizmor template-injection).
      # Deliberately unquoted below so multiple flags word-split.
      - name: Run cargo-mutants on crypto-critical paths
        run: |
          shard_arg=""
          if [ -n "$SHARD_INPUT" ]; then
            shard_arg="--shard $SHARD_INPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            week=$(date -u +%V)
            shard_index=$(( 10#$week % 8 ))
            shard_arg="--shard ${shard_index}/8"
          fi
          cargo mutants \
            --package pqfile \
            --file pqfile/src/decrypt.rs \
            --file pqfile/src/format.rs \
            --file pqfile/src/shamir.rs \
            --file pqfile/src/passphrase.rs \
            --timeout-multiplier 5 \
            --minimum-test-timeout 60 \
            --no-shuffle \
            $shard_arg \
            $EXTRA_FLAGS
        env:
          CARGO_INCREMENTAL: '0'
          EXTRA_FLAGS: ${{ github.event.inputs.extra_flags }}
          SHARD_INPUT: ${{ github.event.inputs.shard }}

      - name: Upload mutants log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-log
          path: mutants.out/
          if-no-files-found: ignore
