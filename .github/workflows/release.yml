name: Release

on:
  push:
    tags: ['v[0-9]*']

jobs:
  check-versions:
    name: Version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check all version fields match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAIL=0

          check() {
            local label="$1" found="$2"
            if [ "$found" = "$TAG" ]; then
              echo "OK:   $label = $found"
            else
              echo "FAIL: $label has '$found', expected '$TAG'"
              FAIL=1
            fi
          }

          check "pqfile/Cargo.toml"                      "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile/Cargo.toml)"
          check "pqfile-cli/Cargo.toml"               "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-cli/Cargo.toml)"
          check "pqfile-gui/Cargo.toml"               "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-gui/Cargo.toml)"
          check "pqfile-desktop/Cargo.toml"           "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-desktop/Cargo.toml)"
          check "pqfile-desktop/packaging/setup.iss"  "$(grep -oP '#define AppVersion\s+"\K[^"]+' pqfile-desktop/packaging/setup.iss)"
          check "pqfile-cli/packaging/pqfile.spec"    "$(grep -oP '^Version:\s+\K\S+' pqfile-cli/packaging/pqfile.spec)"
          check "sonar-project.properties"            "$(grep -oP '^sonar\.projectVersion=\K\S+' sonar-project.properties)"

          exit $FAIL

  # No separate test job: CI already ran fmt, clippy, and the full test suite
  # on this exact commit before the tag was pushed.  Repeating it here doubles
  # release time with no additional signal.

  build:
    name: Build - ${{ matrix.target }}
    needs: check-versions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-linux-deps

      # No Cargo cache here, deliberately: restoring a poisonable cache into a
      # release build would let a poisoned entry flow into the shipped,
      # provenance-attested binaries (zizmor cache-poisoning). Releases are
      # rare enough that a cold build is an acceptable price.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-auditable

      # `cargo auditable` embeds the full dependency tree in a compressed
      # .dep-v0 section of each binary, so shipped artifacts can be scanned
      # for vulnerable dependencies with `cargo audit bin` after the fact.
      #
      # CLI only: PGO needs a headless-scriptable workload to collect profile
      # data, which the GUI (pqfile-desktop) has no way to provide in CI.
      # Non-fatal by design: `pgo_build` below runs entirely inside a
      # `set +e` block, so a failure anywhere in the instrument / workload /
      # merge / optimize sequence (llvm-profdata missing, the workload
      # erroring, a cross-compiled target's instrumented binary not being
      # runnable on the host, ...) falls back to the plain build that shipped
      # before this existed, rather than failing the release - see the
      # release-pipeline breakage on 2026-06-26 for why that bar matters here.
      - name: Add llvm-tools-preview (for PGO)
        run: rustup component add llvm-tools-preview

      - name: Build CLI (PGO-optimized, falls back to a normal build on failure)
        shell: bash
        run: |
          set +e
          PROFILE_DIR="$PWD/target/pgo-profiles"
          rm -rf "$PROFILE_DIR"
          mkdir -p "$PROFILE_DIR"

          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          PROFDATA_TOOL="$SYSROOT/lib/rustlib/$HOST/bin/llvm-profdata"
          [ -x "$PROFDATA_TOOL" ] || PROFDATA_TOOL="$PROFDATA_TOOL.exe"
          BIN="target/${{ matrix.target }}/release/pqfile${{ matrix.ext }}"

          pgo_build() {
            echo "== PGO: instrumented build =="
            RUSTFLAGS="-Cprofile-generate=$PROFILE_DIR" \
              cargo auditable build --release --locked -p pqfile-cli --target ${{ matrix.target }} || return 1

            echo "== PGO: training workload =="
            LLVM_PROFILE_FILE="$PROFILE_DIR/pqfile_%m_%p.profraw" \
              bash scripts/pgo_workload.sh "$BIN" || return 1

            echo "== PGO: merging profiles =="
            "$PROFDATA_TOOL" merge -o "$PROFILE_DIR/merged.profdata" "$PROFILE_DIR"/pqfile_*.profraw || return 1

            echo "== PGO: optimized build =="
            RUSTFLAGS="-Cprofile-use=$PROFILE_DIR/merged.profdata -Cllvm-args=-pgo-warn-missing-function" \
              cargo auditable build --release --locked -p pqfile-cli --target ${{ matrix.target }} || return 1
          }

          if pgo_build; then
            echo "PGO build succeeded."
          else
            echo "::warning::PGO build failed for ${{ matrix.target }}; falling back to a normal (non-PGO) build for pqfile-cli"
            cargo auditable build --release --locked -p pqfile-cli --target ${{ matrix.target }}
          fi

      - name: Build desktop GUI
        run: cargo auditable build --release --locked -p pqfile-desktop --target ${{ matrix.target }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The version goes through env vars rather than ${{ }} interpolation into
      # scripts here and below (shell-injection vector, zizmor
      # template-injection); it derives from the pushed tag name.
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\pqfile-desktop.exe" "target\release\pqfile-desktop.exe"
          iscc /DAppVersion=$env:APP_VERSION "pqfile-desktop\packaging\setup.iss"

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/pqfile${{ matrix.ext }}" \
             "dist/pqfile-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/pqfile-desktop${{ matrix.ext }}" \
             "dist/pqfile-desktop-${{ matrix.target }}${{ matrix.ext }}"

      - name: Stage Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "pqfile-desktop/packaging/output/pqfile-setup-${APP_VERSION}.exe" dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/

  wasm:
    name: Build - WASM
    needs: check-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: latest

      - name: Install binaryen (wasm-opt) and brotli
        run: sudo apt-get install -y binaryen brotli

      # No Cargo cache here, deliberately: see the build job's note on
      # cache poisoning in release builds.
      - name: Build WASM
        working-directory: pqfile-gui
        run: trunk build --release

      - name: Pre-compress assets
        working-directory: pqfile-gui
        run: |
          for f in dist/*.wasm dist/*.js; do
            [ -f "$f" ] && gzip --keep --force -9 "$f"
            [ -f "$f" ] && brotli --best --keep "$f"
          done

      - name: Archive WASM
        run: tar -czf pqfile-web.tar.gz -C pqfile-gui/dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-wasm
          path: pqfile-web.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # required for cosign keyless signing and provenance attestation via GitHub OIDC
      attestations: write  # required to store SLSA build provenance attestations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./* | sort > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SLSA build provenance: records which workflow, commit, and runner
      # produced each artifact, verifiable with `gh attestation verify <file>
      # --repo dangel34/PQ-File-Encryption`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*
            !artifacts/checksums.txt

      - name: Sign checksums with cosign (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle artifacts/checksums.txt.bundle \
            artifacts/checksums.txt
        # Verified in publish.yml's `deploy` job (`Verify checksums signature`
        # step) before checksums.txt is trusted to authenticate the WASM
        # tarball pulled from the release. Manual verification uses the same
        # command: cosign verify-blob \
        #   --bundle artifacts/checksums.txt.bundle \
        #   --certificate-identity-regexp 'https://github.com/dangel34/.*' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #   artifacts/checksums.txt

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo cyclonedx --format json --override-filename bom --all
          # cargo-cyclonedx writes bom.json next to each Cargo.toml; collect them all
          mkdir -p artifacts
          for bom in pqfile/bom.json pqfile-cli/bom.json pqfile-gui/bom.json pqfile-desktop/bom.json; do
            crate=$(dirname "$bom")
            cp "$bom" "artifacts/sbom-${crate}.cdx.json"
          done

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft -q '.isDraft' 2>/dev/null || echo "missing")
          if [ "$existing" = "false" ]; then
            echo "Release already published - skipping to avoid reverting to draft"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --title "pqfile $RELEASE_TAG" \
            --generate-notes \
            --draft \
            ./artifacts/*

