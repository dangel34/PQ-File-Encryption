name: Release

on:
  push:
    tags: ['v[0-9]*']

jobs:
  check-versions:
    name: Version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check all version fields match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAIL=0

          check() {
            local label="$1" found="$2"
            if [ "$found" = "$TAG" ]; then
              echo "OK:   $label = $found"
            else
              echo "FAIL: $label has '$found', expected '$TAG'"
              FAIL=1
            fi
          }

          check "pqfile/Cargo.toml"                   "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile/Cargo.toml)"
          check "pqfile-gui/Cargo.toml"               "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-gui/Cargo.toml)"
          check "pqfile-desktop/Cargo.toml"           "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-desktop/Cargo.toml)"
          check "pqfile-gui/src/lib.rs"               "$(grep -oP '(?<=APP_VERSION: &str = ")[^"]+' pqfile-gui/src/lib.rs)"
          check "pqfile-desktop/packaging/setup.iss"  "$(grep -oP '#define AppVersion\s+"\K[^"]+' pqfile-desktop/packaging/setup.iss)"
          check "pqfile/packaging/pqfile.spec"        "$(grep -oP '^Version:\s+\K\S+' pqfile/packaging/pqfile.spec)"
          check "sonar-project.properties"            "$(grep -oP '(?<=sonar\.projectVersion=)\S+' sonar-project.properties)"

          exit $FAIL

  test:
    name: Test suite
    needs: check-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build — ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: Build CLI
        run: cargo build --release --locked -p pqfile --target ${{ matrix.target }}

      - name: Build desktop GUI
        run: cargo build --release --locked -p pqfile-desktop --target ${{ matrix.target }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\pqfile-desktop.exe" "target\release\pqfile-desktop.exe"
          iscc /DAppVersion=${{ steps.version.outputs.version }} "pqfile-desktop\packaging\setup.iss"

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/pqfile${{ matrix.ext }}" \
             "dist/pqfile-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/pqfile-desktop${{ matrix.ext }}" \
             "dist/pqfile-desktop-${{ matrix.target }}${{ matrix.ext }}"

      - name: Stage Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp "pqfile-desktop/packaging/output/pqfile-setup-${{ steps.version.outputs.version }}.exe" dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/

  wasm:
    name: Build — WASM
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: latest

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Build WASM
        working-directory: pqfile-gui
        run: trunk build --release

      - name: Archive WASM
        run: tar -czf pqfile-web.tar.gz -C pqfile-gui/dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-wasm
          path: pqfile-web.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./* | sort > checksums.txt

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "pqfile ${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            ./artifacts/*
