name: Release

on:
  push:
    tags: ['v[0-9]*']

jobs:
  check-versions:
    name: Version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check all version fields match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAIL=0

          check() {
            local label="$1" found="$2"
            if [ "$found" = "$TAG" ]; then
              echo "OK:   $label = $found"
            else
              echo "FAIL: $label has '$found', expected '$TAG'"
              FAIL=1
            fi
          }

          check "pqfile/Cargo.toml"                      "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile/Cargo.toml)"
          check "pqfile-cli/Cargo.toml"               "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-cli/Cargo.toml)"
          check "pqfile-gui/Cargo.toml"               "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-gui/Cargo.toml)"
          check "pqfile-desktop/Cargo.toml"           "$(grep -m1 -oP '(?<=^version = ")[^"]+' pqfile-desktop/Cargo.toml)"
          check "pqfile-gui/src/lib.rs"               "$(grep -oP '(?<=APP_VERSION: &str = ")[^"]+' pqfile-gui/src/lib.rs)"
          check "pqfile-desktop/packaging/setup.iss"  "$(grep -oP '#define AppVersion\s+"\K[^"]+' pqfile-desktop/packaging/setup.iss)"
          check "pqfile-cli/packaging/pqfile.spec"    "$(grep -oP '^Version:\s+\K\S+' pqfile-cli/packaging/pqfile.spec)"

          exit $FAIL

  # No separate test job: CI already ran fmt, clippy, and the full test suite
  # on this exact commit before the tag was pushed.  Repeating it here doubles
  # release time with no additional signal.

  build:
    name: Build — ${{ matrix.target }}
    needs: check-versions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: Build CLI
        run: cargo build --release --locked -p pqfile-cli --target ${{ matrix.target }}

      - name: Build desktop GUI
        run: cargo build --release --locked -p pqfile-desktop --target ${{ matrix.target }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\pqfile-desktop.exe" "target\release\pqfile-desktop.exe"
          iscc /DAppVersion=${{ steps.version.outputs.version }} "pqfile-desktop\packaging\setup.iss"

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/pqfile${{ matrix.ext }}" \
             "dist/pqfile-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/pqfile-desktop${{ matrix.ext }}" \
             "dist/pqfile-desktop-${{ matrix.target }}${{ matrix.ext }}"

      - name: Stage Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp "pqfile-desktop/packaging/output/pqfile-setup-${{ steps.version.outputs.version }}.exe" dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/

  wasm:
    name: Build — WASM
    needs: check-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: latest

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Build WASM
        working-directory: pqfile-gui
        run: trunk build --release

      - name: Pre-compress assets
        working-directory: pqfile-gui
        run: |
          for f in dist/*.wasm dist/*.js; do
            [ -f "$f" ] && gzip --keep --force -9 "$f"
          done

      - name: Archive WASM
        run: tar -czf pqfile-web.tar.gz -C pqfile-gui/dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-wasm
          path: pqfile-web.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./* | sort > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with cosign (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle artifacts/checksums.txt.bundle \
            artifacts/checksums.txt
        # Verification: cosign verify-blob \
        #   --bundle artifacts/checksums.txt.bundle \
        #   --certificate-identity-regexp 'https://github.com/dangel34/.*' \
        #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #   artifacts/checksums.txt

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2.81.8
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo cyclonedx --format json --override-filename bom --all
          # cargo-cyclonedx writes bom.json next to each Cargo.toml; collect them all
          mkdir -p artifacts
          for bom in pqfile/bom.json pqfile-cli/bom.json pqfile-gui/bom.json pqfile-desktop/bom.json; do
            crate=$(dirname "$bom")
            cp "$bom" "artifacts/sbom-${crate}.cdx.json"
          done

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "pqfile ${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            ./artifacts/*

  deploy:
    name: Deploy to RaspberryPi
    needs: [release]
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-wasm
          path: wasm-dist/

      - name: Extract WASM
        run: |
          mkdir -p pqfile-gui/dist
          tar -xzf wasm-dist/pqfile-web.tar.gz -C pqfile-gui/dist

      - name: Deploy to /var/www/pqfile
        run: rsync -a --delete pqfile-gui/dist/ /var/www/pqfile/

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail --silent --show-error
