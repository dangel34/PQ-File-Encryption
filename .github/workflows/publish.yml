name: Publish

# Fires exactly once: when a GitHub Release is published (i.e. moved out of draft).
# The Release workflow builds artifacts and creates a *draft* release on tag push;
# this workflow only runs when a human explicitly clicks "Publish release", giving
# a review gate before touching the immutable crates.io registry and deploying to prod.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # Check out the exact tag that was released for reproducibility.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1 (pinned for 1.96.0) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.96.0

      # Idempotency guard: check crates.io REST API (not the sparse index, which lags).
      # Skips publishing any crate that is already present, so re-running the workflow
      # after a partial failure or accidental double-trigger is always safe.
      - name: Check which crates are already published
        id: check
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; \
              pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='pqfile'))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          check_crate() {
            local name="$1"
            local http
            http=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${name}/${VERSION}")
            [ "$http" = "200" ]
          }

          if check_crate pqfile; then
            echo "pqfile_published=true"  >> "$GITHUB_OUTPUT"
            echo "pqfile $VERSION already on crates.io -- skipping"
          else
            echo "pqfile_published=false" >> "$GITHUB_OUTPUT"
            echo "pqfile $VERSION not yet on crates.io -- will publish"
          fi

          if check_crate pqfile-cli; then
            echo "cli_published=true"  >> "$GITHUB_OUTPUT"
            echo "pqfile-cli $VERSION already on crates.io -- skipping"
          else
            echo "cli_published=false" >> "$GITHUB_OUTPUT"
            echo "pqfile-cli $VERSION not yet on crates.io -- will publish"
          fi

      - name: Install cargo-semver-checks
        if: steps.check.outputs.pqfile_published == 'false'
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: cargo-semver-checks

      # Pre-publish API stability gate: catches an accidental semver break that
      # slipped past CI (e.g. a tag cut from a stale branch). Baseline is the
      # latest published pqfile on crates.io; an intentional break passes once
      # the version is bumped to the next major.
      - name: Check pqfile API against latest published version
        if: steps.check.outputs.pqfile_published == 'false'
        run: cargo semver-checks --package pqfile --all-features

      - name: Publish pqfile
        if: steps.check.outputs.pqfile_published == 'false'
        run: |
          set +e
          out=$(cargo publish -p pqfile --locked 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -qi "already uploaded\|already exists"; then
            echo "pqfile already on crates.io -- skipping"
            exit 0
          fi
          exit $rc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Retry publishing pqfile-cli until the sparse index has pqfile visible.
      # cargo publish uses the sparse index (not the REST API), which can lag a
      # few minutes after the pqfile upload completes. Retrying here avoids a
      # separate polling step and handles the lag transparently.
      - name: Publish pqfile-cli
        if: steps.check.outputs.cli_published == 'false'
        run: |
          for i in $(seq 1 24); do
            set +e
            out=$(cargo publish -p pqfile-cli --locked 2>&1)
            rc=$?
            set -e
            echo "$out"
            if [ $rc -eq 0 ]; then
              echo "pqfile-cli published successfully"
              exit 0
            fi
            if echo "$out" | grep -qi "already uploaded\|already exists"; then
              echo "pqfile-cli already on crates.io -- skipping"
              exit 0
            fi
            echo "Attempt $i/24 failed, retrying in 30s..."
            sleep 30
          done
          echo "pqfile-cli publish failed after all retries" >&2
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  deploy:
    name: Deploy to RaspberryPi
    needs: [publish]
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Check out repo (for nginx/ config)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The tag name goes through an env var rather than being interpolated
      # into the script: release names are attacker-influenced in the general
      # case and direct ${{ }} interpolation into run: is a shell-injection
      # vector (zizmor template-injection).
      - name: Download WASM from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          rm -rf wasm-dist && mkdir wasm-dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pqfile-web.tar.gz" \
            --pattern "checksums.txt" \
            --pattern "checksums.txt.bundle" \
            --dir wasm-dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Close the loop on the SLSA/cosign chain release.yml already builds:
      # don't just trust checksums.txt at face value, verify it was actually
      # signed by this repo's release workflow via keyless cosign before
      # using it to authenticate the tarball we're about to deploy.
      - name: Verify checksums signature
        run: |
          cd wasm-dist
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity-regexp 'https://github.com/dangel34/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      - name: Verify and extract WASM
        run: |
          cd wasm-dist
          grep "pqfile-web.tar.gz" checksums.txt | sed 's|\./||g' | sha256sum --check
          rm -rf ../pqfile-gui/dist && mkdir -p ../pqfile-gui/dist
          tar -xzf pqfile-web.tar.gz -C ../pqfile-gui/dist

      - name: Deploy to /var/www/pqfile
        run: rsync -a --delete pqfile-gui/dist/ /var/www/pqfile/

      # Sync the version-controlled nginx config from nginx/ to /etc/nginx and
      # reload - but only after `nginx -t` validates the merged config, so a bad
      # edit can never take the site down. The self-hosted runner user needs a
      # sudoers entry limited to: cp, install, nginx, systemctl reload nginx.
      # See nginx/README.md.
      - name: Install and reload nginx config
        run: |
          sudo install -m 0644 nginx/snippets/security-headers-pqfile.conf /etc/nginx/snippets/security-headers-pqfile.conf
          sudo install -m 0644 nginx/snippets/wasm-headers.conf            /etc/nginx/snippets/wasm-headers.conf
          sudo install -m 0644 nginx/snippets/cloudflare-ips.conf          /etc/nginx/snippets/cloudflare-ips.conf
          sudo install -m 0644 nginx/sites-available/pqfile                /etc/nginx/sites-available/pqfile
          # Ensure the site is enabled (no-op if the symlink already exists).
          sudo ln -sf /etc/nginx/sites-available/pqfile /etc/nginx/sites-enabled/pqfile
          # Validate the full merged config; only reload if it passes.
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            --fail --silent --show-error
