name: Publish to crates.io

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Guard: only run when the Release workflow succeeded AND the trigger came
    # from this repository itself (not a fork). This prevents untrusted code
    # from a forked PR from accessing CARGO_REGISTRY_TOKEN.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    steps:
      # Use the exact commit SHA from the triggering workflow run for reproducibility;
      # branch names are mutable. The `head_repository.full_name == github.repository`
      # guard above ensures this SHA always comes from our own repo, not a fork.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 1.96.0
        with:
          toolchain: 1.96.0

      - name: Publish pqfile
        run: cargo publish -p pqfile --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Poll crates.io until the new pqfile version is visible in the index.
      # pqfile-cli depends on it and cargo publish will fail if the index lags.
      # Each iteration waits 10 s; most propagations finish within 60 s.
      - name: Wait for pqfile to appear in crates.io index
        run: |
          PQFILE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; \
              pkgs=json.load(sys.stdin)['packages']; \
              print(next(p['version'] for p in pkgs if p['name']=='pqfile'))")
          echo "Waiting for pqfile $PQFILE_VERSION on crates.io..."
          for i in $(seq 1 30); do
            if cargo search pqfile --limit 1 | grep -qF "pqfile = \"$PQFILE_VERSION\""; then
              echo "Found pqfile $PQFILE_VERSION in index after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for pqfile $PQFILE_VERSION in crates.io index" >&2
          exit 1

      - name: Publish pqfile-cli
        run: cargo publish -p pqfile-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
