name: SonarQube Analysis

# Full instrumented `cargo llvm-cov` coverage run - the heaviest job in the
# whole CI setup (re-runs the entire test suite under coverage
# instrumentation on top of ci.yml's own plain test run). Moved off every
# push/PR to a weekly schedule (2026-07-21) to cut recurring CI-minutes cost;
# workflow_dispatch is available for an on-demand run, e.g. right before
# checking the dashboard. Since this no longer runs on pull_request, it
# cannot be a required status check on branch protection - if it is
# currently configured as one, that rule needs to be relaxed or every future
# PR will be permanently blocked on a check that never starts.
on:
  schedule:
    - cron: '0 5 * * 1'  # 05:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history required for blame / new-code detection
          persist-credentials: false

      - uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: sonar
          cache-target: "true"

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --features pqfile/async --lcov --output-path lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
