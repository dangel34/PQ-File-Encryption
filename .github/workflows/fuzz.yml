name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 4'  # 03:00 UTC every Thursday
  workflow_dispatch:

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_header_read
          - fuzz_decrypt_bytes
          - fuzz_pem_parsing
          - fuzz_exhume
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # v1 # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }} for 120 seconds
        run: |
          cargo fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu \
            -- \
            -max_total_time=120 \
            -timeout=30 \
            -max_len=65536

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
