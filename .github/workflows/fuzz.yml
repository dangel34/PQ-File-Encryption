name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 4'  # 03:00 UTC every Thursday
  workflow_dispatch:

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_header_read
          - fuzz_decrypt_bytes
          - fuzz_pem_parsing
          - fuzz_exhume
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }} for 120 seconds
        run: |
          cargo fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu \
            -- \
            -max_total_time=120 \
            -timeout=30 \
            -max_len=65536

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
