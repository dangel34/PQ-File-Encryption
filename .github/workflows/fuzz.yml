name: Fuzz

on:
  schedule:
    - cron: '0 3 * * 4'  # 03:00 UTC every Thursday
  workflow_dispatch:

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_header_read
          - fuzz_decrypt_bytes
          - fuzz_pem_parsing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }} for 120 seconds
        run: |
          cargo fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            --target x86_64-unknown-linux-gnu \
            -- \
            -max_total_time=120 \
            -timeout=30 \
            -max_len=65536

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
