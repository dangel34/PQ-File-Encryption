name: Submit to winget-pkgs

# Fires automatically when a GitHub release is published (draft → published).
# Requires a PAT with 'public_repo' scope stored as the WINGET_TOKEN secret.
# First-time setup: create the token at https://github.com/settings/tokens and
# add it as a repository secret named WINGET_TOKEN.
#
# First submission: the PR to microsoft/winget-pkgs must be approved by their
# reviewers before the package appears in winget. Subsequent version updates are
# merged automatically once the package is established.

on:
  release:
    types: [published]

jobs:
  winget:
    name: Submit winget manifest
    runs-on: windows-latest
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read

    steps:
      - name: Download manifests from release
        shell: pwsh
        run: |
          $tag  = "${{ github.event.release.tag_name }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/${tag}"
          New-Item -ItemType Directory -Force manifests | Out-Null
          @(
            "dangel34.pqfile.yaml",
            "dangel34.pqfile.installer.yaml",
            "dangel34.pqfile.locale.en-US.yaml"
          ) | ForEach-Object {
            $out = "manifests/$_"
            Invoke-WebRequest -Uri "${base}/$_" -OutFile $out
            Write-Host "=== $_ ===" ; Get-Content $out ; Write-Host ""
          }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Submit PR to winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "::warning::WINGET_TOKEN secret not set — skipping auto-submit."
            Write-Host "To enable: create a PAT with 'public_repo' scope at https://github.com/settings/tokens"
            Write-Host "and add it as a repository secret named WINGET_TOKEN."
            Write-Host "The manifests are attached to the release for manual submission to microsoft/winget-pkgs."
            exit 0
          }
          .\wingetcreate.exe submit `
            --token $env:WINGET_TOKEN `
            --path manifests
          Write-Host "PR submitted to microsoft/winget-pkgs"
