ShortDescription: Quantum-resistant file encryption using ML-KEM-768 and ChaCha20-Poly1305
Description: |-
  pqfile is a post-quantum file encryption tool built on ML-KEM-768 (NIST FIPS 203) for key
  encapsulation and ChaCha20-Poly1305 for authenticated symmetric encryption. The desktop GUI
  lets you generate key pairs, encrypt files to a recipient's public key, and decrypt .pqf
  files with a private key. All operations run locally — no keys, files, or metadata are
  transmitted over the network.
