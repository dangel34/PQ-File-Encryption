# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Dependency graph
# ---------------------------------------------------------------------------
[graph]
# No target filtering; check all platforms so cross-compile artifacts are covered.
targets = []

# ---------------------------------------------------------------------------
# Security advisories (RustSec)
# ---------------------------------------------------------------------------
[advisories]
version = 2
# Yanked crates are treated as errors.
yanked = "deny"
# Ignored advisories are unmaintained-crate notices or unpatchable transitive
# dependencies that cannot be updated from this repo.
ignore = [
    # ttf-parser is unmaintained (RUSTSEC-2026-0192); it is a transitive dependency
    # of eframe/egui and cannot be updated from this repo.
    "RUSTSEC-2026-0192",
    # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173); pulled in transitively
    # via two independent paths, both non-wasm32 dev-dependencies only, never
    # compiled into a shipped binary or the WASM bundle: hax-lib-macros ->
    # hax-lib -> the libcrux-ml-kem tree (pqfile/tests/kem_oracle.rs), and
    # iai-callgrind-macros -> iai-callgrind (pqfile/benches/iai.rs). 2.0.1 is
    # also the actual latest version on crates.io, so there is nothing to
    # update from this repo either way (matches the advisory's own note that
    # no safe upgrade exists). cargo may print a "will be rejected by a future
    # version of Rust" future-incompatibility notice for this crate during a
    # build that includes dev-dependencies (e.g. the iai-bench CI job) - that
    # notice is informational only and does not fail the build.
    "RUSTSEC-2026-0173",
    # bincode 1.3.3 is unmaintained (RUSTSEC-2025-0141); pulled in transitively by
    # iai-callgrind-runner for IPC between the benchmark binary and the runner
    # process. Non-wasm32 dev-dependency only (pqfile/benches/iai.rs), never
    # compiled into a shipped binary or the WASM bundle, and never touches
    # attacker-controlled input. No safe upgrade exists per the advisory.
    "RUSTSEC-2025-0141",
]

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
version = 2
# Allowed SPDX identifiers. Covers every license present in the transitive
# dependency tree at time of writing. Add new entries here rather than
# removing existing ones.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CC0-1.0",
    # egui-winit → arboard → clipboard-win / error-code
    "BSL-1.0",
    # egui → epaint_default_fonts (bundled font assets)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # drand_core → ureq (platform-verifier feature) → rustls-platform-verifier
    # → webpki-roots / webpki-root-certs (Mozilla's own license for its
    # embedded root CA certificate data, not executable code).
    "CDLA-Permissive-2.0",
]
# Confidence threshold for license detection via SPDX header scanning.
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# The eframe/egui/wgpu ecosystem pulls in unavoidable duplicate transitive
# dependencies (accesskit, bitflags, calloop, etc.) that we cannot resolve.
# Core AEAD/KEM crates (ml-kem, chacha20poly1305, argon2, aes-gcm) are single-
# version; sha3 has two (0.11 via slh-dsa's older digest/block-buffer chain,
# 0.12 direct) since SLH-DSA-SHAKE-192f was added. Duplicates with a known
# vulnerability would still be caught by a RustSec advisory.
multiple-versions = "allow"
# Wildcard dependencies in Cargo.toml are not allowed.
wildcards = "deny"
# Highlight all duplicates (not just the first) in output.
highlight = "all"

# Deny crates with known supply-chain concerns or deprecated/unmaintained status.
deny = [
    # openssl-sys pulls in system OpenSSL; the project uses pure-Rust crypto only.
    { name = "openssl-sys" },
    { name = "openssl" },
]

# ---------------------------------------------------------------------------
# Source policy
# ---------------------------------------------------------------------------
[sources]
# Disallow crates from unknown registries or unreferenced git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
