# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Dependency graph
# ---------------------------------------------------------------------------
[graph]
# No target filtering; check all platforms so cross-compile artifacts are covered.
targets = []

# ---------------------------------------------------------------------------
# Security advisories (RustSec)
# ---------------------------------------------------------------------------
[advisories]
version = 2
# Yanked crates are treated as errors.
yanked = "deny"
# Ignored advisories are unmaintained-crate notices from dev-only or indirect
# transitive dependencies that cannot be updated from this repo.
ignore = [
    # ansi_term: unmaintained, pulled in by dudect-bencher (dev benchmark dep)
    # via clap v2. Not a security vulnerability; no safe upgrade path for the
    # dev dep without replacing dudect-bencher.
    { id = "RUSTSEC-2021-0139", reason = "dev-only via dudect-bencher -> clap v2; not a security issue" },

    # atty: unmaintained, same dependency chain as ansi_term above.
    { id = "RUSTSEC-2024-0375", reason = "dev-only via dudect-bencher -> clap v2; not a security issue" },

    # instant: unmaintained, pulled in transitively by notify v7 (watchfolder
    # feature). No upstream fix available yet; not a security vulnerability.
    { id = "RUSTSEC-2024-0384", reason = "transitive via notify v7 -> notify-types; not a security issue" },
]

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
version = 2
# Allowed SPDX identifiers. Covers every license present in the transitive
# dependency tree at time of writing. Add new entries here rather than
# removing existing ones.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CC0-1.0",
    # egui-winit → arboard → clipboard-win / error-code
    "BSL-1.0",
    # egui → epaint_default_fonts (bundled font assets)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Confidence threshold for license detection via SPDX header scanning.
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# The eframe/egui/wgpu ecosystem pulls in unavoidable duplicate transitive
# dependencies (accesskit, bitflags, calloop, etc.) that we cannot resolve.
# Crypto crates (ml-kem, chacha20poly1305, argon2, aes-gcm) are all single-
# version; duplicates in those would be caught by a RustSec advisory instead.
multiple-versions = "allow"
# Wildcard dependencies in Cargo.toml are not allowed.
wildcards = "deny"
# Highlight all duplicates (not just the first) in output.
highlight = "all"

# Deny crates with known supply-chain concerns or deprecated/unmaintained status.
deny = [
    # openssl-sys pulls in system OpenSSL; the project uses pure-Rust crypto only.
    { name = "openssl-sys" },
    { name = "openssl" },
]

# ---------------------------------------------------------------------------
# Source policy
# ---------------------------------------------------------------------------
[sources]
# Disallow crates from unknown registries or unreferenced git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
